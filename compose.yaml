services:
  site:
    build: .
    container_name: site
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:2.11.7-alpine
    container_name: caddy
    depends_on:
      - site
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
